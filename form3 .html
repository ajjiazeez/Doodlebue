<!DOCTYPE html>
<html lang="en">
<head>
    <title>Button Alert Example</title>
</head>
<body>

    <!-- 1. Create the button with a unique ID -->
    <button id="myButton">Click Me!</button>

    <script>
        // 2. Target the button by its ID
        const button = document.getElementById("myButton");

        // 3. Listen for a click event to trigger the alert
        button.addEventListener("click", function() {
            alert("Hello! This is your alert message.");
        });
    </script>

</body>
</html>
